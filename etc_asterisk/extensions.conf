[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; (Puedes definir variables globales aquí si las necesitas)


; =================================================================
; == CONTEXTO DE SEGURIDAD (Agujero Negro) ==
; =================================================================
; Para llamadas anónimas (definido en sip.conf: allowguest=no)
[blackhole]
exten => _X.,1,NoOp(Llamada anónima rechazada de ${CALLERID(num)} a ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(ss-noservice)
 same => n,Hangup()


; =================================================================
; == CONTEXTO PARA TODOS LOS CLIENTES (TRONCALES Y SOFTPHONES) ==
; =================================================================
[clientes-entrante]

; --- 0. SIMULACION DE LLAMADA ENTRANTE (Softphone -> Troncal por DID) ---
; Esta lógica va ANTES de la simulación PSTN general.

; Rango Grupo 1: _225881XXX
exten => _225881XXX,1,NoOp(Llamada de Softphone a DID Grupo 1 (${EXTEN}) desde ${CALLERID(num)})
    same => n,Set(DID_GROUP=1)
    same => n,Set(DID_NUMBER=${EXTEN}) ; <-- Guardamos el DID
    same => n,Goto(map-to-trunk,s,1)

; Rango Grupo 2: _225882XXX
exten => _225882XXX,1,NoOp(Llamada de Softphone a DID Grupo 2 (${EXTEN}) desde ${CALLERID(num)})
    same => n,Set(DID_GROUP=2)
    same => n,Set(DID_NUMBER=${EXTEN}) ; <-- Guardamos el DID
    same => n,Goto(map-to-trunk,s,1)

; Rango Grupo 3: _225883XXX
exten => _225883XXX,1,NoOp(Llamada de Softphone a DID Grupo 3 (${EXTEN}) desde ${CALLERID(num)})
    same => n,Set(DID_GROUP=3)
    same => n,Set(DID_NUMBER=${EXTEN}) ; <-- Guardamos el DID
    same => n,Goto(map-to-trunk,s,1)

; Rango Grupo 5 (A): _225884XXX
exten => _225884XXX,1,NoOp(Llamada de Softphone a DID Grupo 5A (${EXTEN}) desde ${CALLERID(num)})
    same => n,Set(DID_GROUP=5)
    same => n,Set(DID_NUMBER=${EXTEN}) ; <-- Guardamos el DID
    same => n,Goto(map-to-trunk,s,1)

; Rango Grupo 5 (B): _225885XXX
exten => _225885XXX,1,NoOp(Llamada de Softphone a DID Grupo 5B (${EXTEN}) desde ${CALLERID(num)})
    same => n,Set(DID_GROUP=5)
    same => n,Set(DID_NUMBER=${EXTEN}) ; <-- Guardamos el DID
    same => n,Goto(map-to-trunk,s,1)

; Rango Grupo 6: _225886XXX
exten => _225886XXX,1,NoOp(Llamada de Softphone a DID Grupo 6 (${EXTEN}) desde ${CALLERID(num)})
    same => n,Set(DID_GROUP=6)
    same => n,Set(DID_NUMBER=${EXTEN}) ; <-- Guardamos el DID
    same => n,Goto(map-to-trunk,s,1)


; --- 1. SIMULACION PSTN SALIENTE (Troncal -> Softphone) ---
; Patrones de 9 dígitos (Celular y Fijo)
exten => _[29]XXXXXXXX,1,NoOp(Llamada PSTN simulada de ${CALLERID(num)} para ${EXTEN})
    same => n,GotoIf($["${EXTEN:0:1}" = "2"]?set-local:set-celular)
same => n(set-local),Set(CALL_TYPE=LOCAL)
    same => n,Goto(map-call,s,1)
same => n(set-celular),Set(CALL_TYPE=CELULAR)
    same => n,Goto(map-call,s,1)

; Patrones de emergencia
exten => _13X,1,NoOp(Llamada Emergencia simulada de ${CALLERID(num)} para ${EXTEN})
    same => n,Set(CALL_TYPE=EMERGENCIA)
    same => n,Goto(map-call,s,1)
    same => n,Hangup()


; --- 2. LLAMADAS INTERNAS (Entre todos los clientes) ---
; Permite que 'grupo1-varas' llame a 'grupo2-conce', etc.
exten => _X.,1,NoOp(Llamada interna de ${CALLERID(num)} hacia ${EXTEN})
    same => n,GotoIf($["${SIPPEER(${EXTEN},name)}" != ""]?dial-sip:no-peer)
same => n(no-peer),NoOp(Destino ${EXTEN} no es un peer SIP válido. Colgando.)
    same => n,Hangup()
same => n(dial-sip),NoOp(Peer ${EXTEN} encontrado. Llamando...)
    same => n,Dial(SIP/${EXTEN},30,T)
    same => n,Hangup()


; --- 3. Extensiones Estándar ---
exten => h,1,NoOp(Llamada terminada.)
    same => n,Hangup()
exten => i,1,NoOp(Número inválido marcado por ${CALLERID(num)}: ${EXTEN})
    same => n,Playback(invalid)
    same => n,Hangup()


; =================================================================
; == CONTEXTO DE MAPEO (Troncal -> Softphone) ==
; =================================================================
[map-call]
; Este contexto ahora maneja DOS casos:
; 1. Troncal -> Softphone (Llamada PSTN simulada, ej: avaras1 -> grupo1-varas)
; 2. Softphone -> Softphone (Llamada LOCAL fallida desde map-to-trunk, ej: grupo1-varas -> grupo1-varas)

exten => s,1,NoOp(Iniciando mapeo para ${CALLERID(num)} desde peer ${CHANNEL(peername)}. Tipo: ${CALL_TYPE})
    same => n,Answer()
    same => n,Set(CALLER_PEER=${CHANNEL(peername)})

    ; --- A. Identificar tipo de llamante (Troncal o Softphone) ---
    same => n,GotoIf($["${CALLER_PEER:0:5}" = "grupo"]?CALC_SOFTPHONE_DEST)
    
    ; --- B. Lógica para TRONCALES (ej: avaras1) ---
    same => n(CALC_TRONCAL_DEST),NoOp(Llamante es TRONCAL. Mapeando a su Softphone.)
    same => n,Set(TRONCAL_NUMBER=${CALLER_PEER:-1})
    same => n,Set(TRONCAL_PREFIX=${CALLER_PEER:0:-1})
    same => n,Set(SOFTPHONE_SUFFIX=${TRONCAL_PREFIX})
    same => n,GotoIf($["${TRONCAL_PREFIX}" = "avaras"]?set-suffix-varas)
    same => n,Goto(construct-target)
same => n(set-suffix-varas),Set(SOFTPHONE_SUFFIX=varas)
same => n(construct-target),NoOp(Prefijo: ${TRONCAL_PREFIX}, Num: ${TRONCAL_NUMBER}, Sufijo: ${SOFTPHONE_SUFFIX})
    same => n,Set(DEST_SOFTPHONE=grupo${TRONCAL_NUMBER}-${SOFTPHONE_SUFFIX})
    same => n,Goto(set-callerid)

    ; --- C. Lógica para SOFTPHONES (ej: grupo1-varas) ---
same => n(CALC_SOFTPHONE_DEST),NoOp(Liamante es SOFTPHONE. Devolviendo llamada.)
    same => n,Set(DEST_SOFTPHONE=${CALLER_PEER})
    
    ; --- D. Modificar el CallerID (name) ---
same => n(set-callerid),NoOp(Destino softphone calculado: ${DEST_SOFTPHONE})
    same => n,GotoIf($["${CALL_TYPE}" = "LOCAL"]?set-cid-local)
    same => n,GotoIf($["${CALL_TYPE}" = "CELULAR"]?set-cid-celular)
    same => n,GotoIf($["${CALL_TYPE}" = "EMERGENCIA"]?set-cid-emergencia)
    same => n,Goto(do-dial)
same => n(set-cid-local),Set(CALLERID(name)=Llamada Local <${CALLERID(num)}>)
    same => n,Goto(do-dial)
same => n(set-cid-celular),Set(CALLERID(name)=Llamada a Celular <${CALLERID(num)}>)
    same => n,Goto(do-dial)
same => n(set-cid-emergencia),Set(CALLERID(name)=** EMERGENCIA ** <${CALLERID(num)}>)
    same => n,Goto(do-dial)

    ; --- E. Llamar al Softphone ---
same => n(do-dial),NoOp(Llamando a ${DEST_SOFTPHONE} con CallerID: ${CALLERID(all)})
    same => n,Dial(SIP/${DEST_SOFTPHONE},30,T)
    same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?no-softphone)
    same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?no-softphone)
    same => n,GotoIf($["${DIALSTATUS}" = "UNALLOCATED"]?no-softphone)
    same => n,Hangup()
same => n(no-softphone),NoOp(Error: El softphone ${DEST_SOFTPHONE} no existe o no está registrado. DIALSTATUS=${DIALSTATUS})
    same => n,Playback(silence/1&pbx-invalid)
    same => n,Hangup()


; =================================================================
; == CONTEXTO DE MAPEO (Softphone -> Troncal) ==
; =================================================================
[map-to-trunk]
; ${DID_GROUP} y ${DID_NUMBER} fueron seteados en [clientes-entrante]
exten => s,1,NoOp(Iniciando mapeo Softphone->Troncal para ${CALLERID(num)} a DID ${DID_NUMBER} desde peer ${CHANNEL(peername)})
    
    ; --- A. Validar que el llamante es un Softphone ---
    same => n,Set(CALLER_SOFTPHONE=${CHANNEL(peername)})
    same => n,GotoIf($["${CALLER_SOFTPHONE:0:5}" != "grupo"]?not-softphone)

    ; --- B. Extraer partes del Softphone ---
    same => n,Set(SOFTPHONE_PARTE1=${CUT(CALLER_SOFTPHONE,-,1)}) ; "grupo1"
    same => n,Set(SOFTPHONE_SUFFIX=${CUT(CALLER_SOFTPHONE,-,2)}) ; "varas"
    same => n,Set(SOFTPHONE_NUM=${SOFTPHONE_PARTE1:5}) ; "1"

    ; --- C. Validar Coincidencia de Grupo ---
    same => n,GotoIf($["${SOFTPHONE_NUM}" != "${DID_GROUP}"]?group-mismatch)

    ; --- D. Coincidencia EXITOSA: Construir Troncal Destino ---
    same => n,NoOp(Coincidencia: Softphone Grupo ${SOFTPHONE_NUM} llamando a DID Grupo ${DID_GROUP})
    same => n,Set(TRONCAL_PREFIX=${SOFTPHONE_SUFFIX})
    same => n,GotoIf($["${SOFTPHONE_SUFFIX}" = "varas"]?set-prefix-avaras)
    same => n,Goto(construct-trunk)
same => n(set-prefix-avaras),Set(TRONCAL_PREFIX=avaras)

    ; --- E. Construir y llamar a la Troncal ---
same => n(construct-trunk),NoOp(Sufijo: ${SOFTPHONE_SUFFIX}, Prefijo: ${TRONCAL_PREFIX}, Num: ${SOFTPHONE_NUM})
    same => n,Set(DEST_TRONCAL=${TRONCAL_PREFIX}${SOFTPHONE_NUM})
    same => n,NoOp(Destino troncal calculado: ${DEST_TRONCAL}. Simulando llamada ENTRANTE...)

    ; ¡¡CORRECCIÓN FINAL!! Usamos ${DID_NUMBER} (que guardamos) en lugar de ${EXTEN} (que ahora es 's')
    same => n,Dial(SIP/${DEST_TRONCAL}/${DID_NUMBER},30,T)

    ; Verificamos el resultado DESPUÉS del Dial()
    same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL"]?no-trunk)
    same => n,GotoIf($["${DIALSTATUS}" = "CONGESTION"]?no-trunk)
    same => n,GotoIf($["${DIALSTATUS}" = "UNALLOCATED"]?no-trunk)
    
    same => n,Hangup()

same => n(no-trunk),NoOp(Error: La troncal destino ${DEST_TRONCAL} no existe o no está registrada. DIALSTATUS=${DIALSTATUS})
    same => n,Playback(pbx-invalid)
    same => n,Hangup()

    ; --- F. RUTAS DE FALLO ---
same => n(not-softphone),NoOp(Llamante no es un softphone. ${CALLERID(num)} no empieza con 'grupo'.)
    same => n,Set(CALL_TYPE=LOCAL)
    same => n,Goto(map-call,s,1)
same => n(group-mismatch),NoOp(Fallo de coincidencia: Softphone Grupo ${SOFTPHONE_NUM} llamando a DID Grupo ${DID_GROUP})
    same => n,Set(CALL_TYPE=LOCAL)
    same => n,Goto(map-call,s,1)
