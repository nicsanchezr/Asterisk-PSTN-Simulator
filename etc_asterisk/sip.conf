; =================================================================
; == SECCIÓN GENERAL (chan_sip) ==
; =================================================================
[general]

; --- Configuración de Red ---
; Dado que tienes una IP pública fija y no hay NAT en el servidor,
; esta es la configuración ideal.
transport=udp               ; Usar UDP como transporte principal
bindaddr=0.0.0.0            ; Escuchar en todas las interfaces (incluida tu IP pública)
bindport=5060               ; Puerto estándar SIP (UDP)

; ¡MUY IMPORTANTE!
; Aunque tu *servidor* no tiene NAT, tus clientes sí.
; Debes decirle a Asterisk cuál es su IP pública fija.
; Asterisk usará esta IP en las cabeceras SIP (ej. Contact)
; para que los clientes sepan dónde responder.
externip=104.168.115.246  ; <-- REEMPLAZA ESTO CON TU IP REAL

; --- Seguridad ---
; Estas configuraciones son esenciales para un servidor público.
context=blackhole           ; Contexto por defecto para llamadas anónimas (debe estar vacío)
allowguest=no               ; RECHAZAR todas las llamadas anónimas (invitados)
alwaysauthreject=yes        ; No confirmar si un usuario existe al fallar la autenticación
                            ; (previene enumeración de usuarios)

; --- Codecs (Línea de base) ---
; Establece un orden de codecs por defecto.
disallow=all                ; Deshabilitar todos los codecs primero
allow=ulaw                  ; Permitir ulaw (G.711u)
allow=alaw                  ; Permitir alaw (G.711a)
; (Estos serán heredados por tus plantillas de softphone/troncal)

; --- Manejo de Media (Audio) ---
; "no" es lo mismo que el antiguo "canreinvite=no"
directmedia=no              ; Forzar que todo el audio (RTP) pase a través de Asterisk.
                            ; Esto es VITAL para que manejes el NAT de tus clientes.

; --- Opciones de Registro y Calidad ---
; Valores por defecto para registros (aunque este servidor recibe registros, no los hace)
registertimeout=20
registerattempts=0

; --- Temporizadores de Sesión ---
; Ayuda a limpiar llamadas "fantasma" si se pierde la señalización (BYE)
session-timers=originate
session-expires=180         ; Refrescar la sesión cada 3 minutos

; --- DNS ---
srvlookup=yes               ; Habilitar búsquedas SRV (buena práctica)

; =================================================================
; PLANTILLAS BASE PARA CLIENTES
; =================================================================
;
; Plantilla para TRONCALES (los PBX de tus clientes)
;
[plantilla-troncal](!)
type=friend
host=dynamic               ; El cliente debe registrarse
nat=force_rport,comedia    ; Asumimos que el PBX cliente está en NAT
qualify=yes                ; Monitorear la conexión
context=clientes-entrante  ; Contexto en extensions.conf
disallow=all
allow=ulaw
allow=alaw

;
; Plantilla para SOFTPHONES (Usuarios 'grupo')
;
[plantilla-softphone](!)
type=friend
host=dynamic               ; El softphone debe registrarse
nat=force_rport,comedia    ; Asumimos que el softphone está en NAT
qualify=yes                ; Monitorear la conexión
context=clientes-entrante  ; Contexto en extensions.conf
disallow=all
allow=ulaw
allow=alaw

